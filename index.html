<!-- ********************************************************************************************************************************
     Objetivo: Estrutura da interface web para exibição dos filmes no estilo Netflix.                                              
     Funcionalidades:                                                                                                              
     - Exibição dos filmes em formato de grid                                                                                      
     - Integração com a API de filmes                                                                                              
     - Layout responsivo com tema escuro                                                                                          
     Tecnologias: HTML5                                                                                                            
     Autor: Aleff Blendon Costa                                                                                                    
     Data: 2026                                                                                                                    
     Versão: 1.0                                                                                                                   
******************************************************************************************************************************** -->

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UniFECAF Flix</title>
  <link rel="stylesheet" href="frontend/style.css" />
  <!-- Ícone de lupa via SVG inline no CSS, sem dependência externa -->
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════════ NAVBAR -->
  <header class="navbar">
    <div class="navbar__inner">

      <!-- Logo -->
      <a href="#" class="navbar__logo" onclick="resetHome()">
        <span class="logo__icon">▶</span>
        <span class="logo__text">UniFECAF<span class="logo__flix">Flix</span></span>
      </a>

      <!-- Busca -->
      <div class="navbar__search">
        <input
          type="text"
          id="searchInput"
          class="search__input"
          placeholder="Buscar filmes..."
          autocomplete="off"
        />
        <button class="search__btn" id="searchBtn" aria-label="Buscar">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </button>
      </div>

    </div>
  </header>

  <!-- ═══════════════════════════════════════════════════════════ HERO -->
  <section class="hero" id="hero">
    <div class="hero__content">
      <h1 class="hero__title">Seu catálogo de filmes</h1>
      <p class="hero__subtitle">Explore, descubra e mergulhe no universo do cinema.</p>
    </div>
    <div class="hero__overlay"></div>
  </section>

  <!-- ═══════════════════════════════════════════════════════════ MAIN -->
  <main class="main">

    <!-- Título da seção -->
    <div class="section-header">
      <h2 class="section-title" id="sectionTitle">Todos os Filmes</h2>
      <span class="section-count" id="sectionCount"></span>
    </div>

    <!-- Estado: carregando -->
    <div class="state state--loading" id="stateLoading">
      <div class="spinner"></div>
      <p>Carregando filmes...</p>
    </div>

    <!-- Estado: sem resultados -->
    <div class="state state--empty" id="stateEmpty">
      <span class="state__icon">🎬</span>
      <p class="state__msg" id="emptyMsg">Nenhum filme encontrado.</p>
      <button class="btn btn--outline" onclick="resetHome()">Ver todos os filmes</button>
    </div>

    <!-- Estado: erro -->
    <div class="state state--error" id="stateError">
      <span class="state__icon">⚠️</span>
      <p class="state__msg">Não foi possível conectar à API.</p>
      <button class="btn btn--outline" onclick="carregarFilmes()">Tentar novamente</button>
    </div>

    <!-- Grid de filmes -->
    <div class="filmes-grid" id="filmesGrid"></div>

  </main>

  <!-- ═══════════════════════════════════════════════════════════ MODAL -->
  <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalNome">
    <div class="modal">
      <button class="modal__close" id="modalClose" aria-label="Fechar">✕</button>

      <div class="modal__body">
        <!-- Capa -->
        <div class="modal__capa-wrap">
          <img class="modal__capa" id="modalCapa" src="" alt="" />
        </div>

        <!-- Informações -->
        <div class="modal__info">
          <h2 class="modal__nome" id="modalNome"></h2>

          <div class="modal__badges" id="modalBadges"></div>

          <p class="modal__sinopse" id="modalSinopse"></p>

          <div class="modal__meta" id="modalMeta"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="frontend/script.js"></script>
</body>
</html>
